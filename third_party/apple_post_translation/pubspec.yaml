name: apple_post_translation
description: Native Apple Translation bridge for post text.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ApplePostTranslationPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: ApplePostTranslationPlugin
        sharedDarwinSource: true
