name: Upload iOS to App Store Connect

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional CFBundleVersion; defaults to the pubspec.yaml build number
        required: false
        type: string
      release_notes:
        description: Optional TestFlight release notes
        required: false
        type: string

concurrency:
  group: app-store-upload-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2
  XCODE_VERSION: 26.6
  IOS_BUNDLE_ID: com.kidozh.discuz-flutter
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  upload:
    name: Build, sign, and upload iOS
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.6.0"

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -version -sdk iphoneos
          actual_version=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          if [[ "$actual_version" != "$XCODE_VERSION" ]]; then
            echo "::error::Expected Xcode $XCODE_VERSION, selected $actual_version."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify repository and App Store credentials
        shell: bash
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          test -f pubspec.lock
          test -f ios/ExportOptions.plist
          test -f third_party/extended_text_field/pubspec.yaml
          missing=0
          for name in \
            APPSTORE_ISSUER_ID \
            APPSTORE_API_KEY_ID \
            APPSTORE_API_PRIVATE_KEY \
            APPSTORE_CERTIFICATES_FILE_BASE64 \
            APPSTORE_CERTIFICATES_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions variable or secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests
        run: flutter test

      - name: Import App Store signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ env.IOS_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Determine build number
        id: version
        shell: bash
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [[ -n "$REQUESTED_BUILD_NUMBER" ]]; then
            build_number="$REQUESTED_BUILD_NUMBER"
          else
            source_build=$(awk -F'+' '$1 ~ /^version:/ { print $2; exit }' pubspec.yaml)
            build_number="$source_build"
          fi
          if [[ ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Build number must be a positive integer."
            exit 1
          fi
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building App Store version with build number $build_number"

      - name: Build signed IPA
        run: >-
          flutter build ipa
          --release
          --no-pub
          --build-number=${{ steps.version.outputs.build_number }}
          --export-options-plist=ios/ExportOptions.plist

      - name: Locate IPA
        id: ipa
        shell: bash
        run: |
          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if (( ${#ipa_files[@]} == 0 )); then
            echo "::error::Flutter did not produce an IPA."
            exit 1
          fi
          ipa_path="${ipa_files[0]}"
          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Preserve signed IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-store-${{ steps.version.outputs.build_number }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect and TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: "false"
          wait-for-processing: "true"
