name: Upload iOS to App Store Connect

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_number:
        description: Existing CFBundleVersion; defaults to pubspec.yaml
        required: false
        type: string
      release_notes:
        description: TestFlight notes override for an already uploaded build
        required: false
        type: string
      repair_build_id:
        description: Optional older build whose notes were misplaced by an uploader
        required: false
        type: string

concurrency:
  group: app-store-upload
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5
  IOS_BUNDLE_ID: com.kidozh.discuz-flutter
  PUB_HOSTED_URL: https://pub.dev
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

jobs:
  upload:
    if: github.event_name == 'release' && !github.event.release.prerelease
    name: Build, sign, and upload iOS
    runs-on: ${{ vars.APPSTORE_RUNNER || 'xcode-27' }}
    timeout-minutes: 90
    env:
      REQUIRE_IPHONE_DUO: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select stable Xcode
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.APPSTORE_XCODE_VERSION || 'latest-stable' }}

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -version -sdk iphoneos
          python3 scripts/check_iphone_duo.py --require-duo

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Self-hosted runners keep the SDK and Pub cache on disk.
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Verify repository and App Store credentials
        shell: bash
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          test -f pubspec.lock
          test -f ios/ExportOptions.plist
          test -f third_party/adaptive_platform_ui/pubspec.yaml
          test -f third_party/apple_post_translation/pubspec.yaml
          test -f darwin/WebViewCookies.swift
          missing=0
          for name in \
            APPSTORE_ISSUER_ID \
            APPSTORE_API_KEY_ID \
            APPSTORE_API_PRIVATE_KEY \
            APPSTORE_CERTIFICATES_FILE_BASE64 \
            APPSTORE_CERTIFICATES_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions variable or secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Determine release version
        id: version
        run: python3 scripts/prepare_store_release.py --tag "$GITHUB_REF_NAME" --output build/ios/store-release.json

      - name: Validate TestFlight release notes
        id: testflight_notes
        env:
          BUILD_NAME: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          python3 scripts/prepare_testflight_notes.py \
            --version "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests
        run: |
          flutter test --no-pub test third_party/adaptive_platform_ui/test
          python3 -m unittest discover -s test -p 'test_*.py'
          node --test test/*release*_test.mjs

      - name: Check whether this build already exists
        id: existing_build
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          node scripts/verify_testflight_release.mjs --check-available --reuse-existing \
            --version '${{ steps.version.outputs.version }}' \
            --build-number '${{ steps.version.outputs.build }}'

      - name: Import App Store signing certificate
        if: steps.existing_build.outputs.exists == 'false'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        if: steps.existing_build.outputs.exists == 'false'
        id: iphone_profiles
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ env.IOS_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download Apple Watch provisioning profile
        if: steps.existing_build.outputs.exists == 'false'
        id: watch_profiles
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.kidozh.discuz-flutter.watchkitapp
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Configure distribution signing for both apps
        if: steps.existing_build.outputs.exists == 'false'
        env:
          IPHONE_PROFILES: ${{ steps.iphone_profiles.outputs.profiles }}
          WATCH_PROFILES: ${{ steps.watch_profiles.outputs.profiles }}
        run: |
          python3 scripts/configure_ios_distribution_signing.py \
            --iphone-profiles "$IPHONE_PROFILES" \
            --watch-profiles "$WATCH_PROFILES" \
            --export-options build/ios/AppStoreExportOptions.plist

      - name: Build signed IPA
        if: steps.existing_build.outputs.exists == 'false'
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          key_file="$key_dir/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          unset APPSTORE_API_PRIVATE_KEY
          flutter build ios --release --config-only --no-pub \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build }}
          xcodebuild archive -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath "$key_file" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist build/ios/AppStoreExportOptions.plist \
            -exportPath build/ios/ipa -allowProvisioningUpdates \
            -authenticationKeyPath "$key_file" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Verify archived SDK for iPhone Duo
        if: steps.existing_build.outputs.exists == 'false'
        shell: bash
        run: |
          python3 scripts/check_iphone_duo.py --require-duo --app build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app

      - name: Verify archived iOS version
        if: steps.existing_build.outputs.exists == 'false'
        env:
          EXPECTED_BUILD_NAME: ${{ steps.version.outputs.version }}
          EXPECTED_BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          plist=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = "$EXPECTED_BUILD_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")" = "$EXPECTED_BUILD_NUMBER"

      - name: Verify archived Keychain entitlements
        if: steps.existing_build.outputs.exists == 'false'
        run: python3 scripts/check_ios_keychain.py --app build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app

      - name: Locate IPA
        if: steps.existing_build.outputs.exists == 'false'
        id: ipa
        shell: bash
        run: |
          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if (( ${#ipa_files[@]} == 0 )); then
            echo "::error::Flutter did not produce an IPA."
            exit 1
          fi
          ipa_path="${ipa_files[0]}"
          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Upload to App Store Connect and TestFlight
        if: steps.existing_build.outputs.exists == 'false'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ steps.testflight_notes.outputs.notes }}
          # The upstream uploader matches only CFBundleVersion and may select
          # another version train. The following mandatory verifier waits for
          # the exact version + build, applies these same notes, and reads back.
          wait-for-processing: "false"

      - name: Verify TestFlight notes after Apple processing
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          node scripts/verify_testflight_release.mjs \
            --wait-for-processing \
            --version '${{ steps.version.outputs.version }}' \
            --build-number '${{ steps.version.outputs.build }}'

      - name: Preserve TestFlight verification receipt
        uses: actions/upload-artifact@v7
        with:
          name: testflight-verification-${{ steps.version.outputs.build }}
          path: build/ios/testflight-verification.json
          if-no-files-found: error

      - name: Preserve signed IPA
        if: ${{ !cancelled() && steps.ipa.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-store-${{ steps.version.outputs.build }}
          path: |
            ${{ steps.ipa.outputs.path }}
            build/ios/testflight-release-notes.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Submit App Store and external TestFlight reviews
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          TESTFLIGHT_EXTERNAL_GROUP_ID: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP_ID }}
        run: node scripts/submit_app_store.mjs build/ios/store-release.json build/ios/testflight-verification.json

  verify_existing:
    name: Verify existing TestFlight build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine release version
        id: version
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        shell: bash
        run: |
          version=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)$ ]]; then
            echo "::error::Invalid pubspec version."
            exit 1
          fi
          build_name="${BASH_REMATCH[1]}"
          source_build="${BASH_REMATCH[2]}"
          build_number="${REQUESTED_BUILD_NUMBER:-$source_build}"
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Validate TestFlight release notes
        env:
          CUSTOM_RELEASE_NOTES: ${{ inputs.release_notes }}
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          python3 scripts/prepare_testflight_notes.py --version "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          node --test test/testflight_release_verification_test.mjs

      - name: Verify TestFlight notes after Apple processing
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          REPAIR_BUILD_ID: ${{ inputs.repair_build_id }}
        run: |
          node scripts/verify_testflight_release.mjs --wait-for-processing \
            --version '${{ steps.version.outputs.build_name }}' \
            --build-number '${{ steps.version.outputs.build_number }}' \
            --repair-build-id "$REPAIR_BUILD_ID"

      - name: Preserve TestFlight verification receipt
        uses: actions/upload-artifact@v7
        with:
          name: testflight-verification-${{ steps.version.outputs.build_number }}
          path: build/ios/testflight-verification.json
          if-no-files-found: error
