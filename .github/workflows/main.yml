name: Build & Release

on:
  pull_request:
    branches: [dev, test, master]
  push:
    branches: [dev, test, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "18"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify required repository files
        shell: bash
        run: |
          test -f pubspec.lock || {
            echo "::error::pubspec.lock must be committed for reproducible builds."
            exit 1
          }
          test -f third_party/extended_text_field/pubspec.yaml || {
            echo "::error::The path dependency third_party/extended_text_field is missing."
            exit 1
          }
          test -x android/gradlew || {
            echo "::error::android/gradlew must be committed and executable."
            exit 1
          }
          test -f android/gradle/wrapper/gradle-wrapper.jar || {
            echo "::error::The Gradle wrapper JAR must be committed."
            exit 1
          }

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate release signing secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=keystore.jks\n'
          } > android/key.properties

      - name: Build signed Android release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/
          cp build/app/outputs/bundle/release/app-release.aab release/

      - name: Build Android debug artifact
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        shell: bash
        run: |
          flutter build apk --debug --no-pub
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-debug.apk release/

      - name: Upload Android release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android debug artifact
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: release/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify required repository files
        shell: bash
        run: |
          test -f pubspec.lock || {
            echo "::error::pubspec.lock must be committed for reproducible builds."
            exit 1
          }
          test -f third_party/extended_text_field/pubspec.yaml || {
            echo "::error::The path dependency third_party/extended_text_field is missing."
            exit 1
          }

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package iOS build
        shell: bash
        run: |
          mkdir -p release
          tar -C build/ios/iphoneos -czf release/Runner-ios.tar.gz Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: release/Runner-ios.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true

      - name: Determine release tag
        shell: bash
        run: |
          version=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "::error::Unable to read the version from pubspec.yaml."
            exit 1
          fi

          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            tag="${tag}-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            dist/app-release.apk \
            dist/app-release.aab \
            dist/Runner-ios.tar.gz \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
