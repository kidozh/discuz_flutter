name: Build & Release

on:
  pull_request:
    branches: [dev, test, master]
  push:
    branches: [dev, test, master]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5
  PUB_HOSTED_URL: https://pub.dev
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

jobs:
  release_version:
    name: Validate published release
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: release
        run: python3 scripts/prepare_store_release.py --tag "$GITHUB_REF_NAME"

  android:
    name: Android
    needs: release_version
    if: ${{ !cancelled() && (github.event_name != 'release' || needs.release_version.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify required repository files
        shell: bash
        run: |
          test -f pubspec.lock || {
            echo "::error::pubspec.lock must be committed for reproducible builds."
            exit 1
          }
          test -f third_party/adaptive_platform_ui/pubspec.yaml || {
            echo "::error::The local Liquid Glass package is missing."
            exit 1
          }
          test -f third_party/apple_post_translation/pubspec.yaml || {
            echo "::error::The Apple Translation bridge is missing."
            exit 1
          }
          test -f darwin/WebViewCookies.swift || {
            echo "::error::The shared Apple WebView cookie bridge is missing."
            exit 1
          }
          test -f android/app/src/main/kotlin/com/kidozh/discuz_flutter/WebViewCookiesChannel.kt || {
            echo "::error::The Android WebView cookie bridge is missing."
            exit 1
          }
          test -f lib/utility/NtcColorLocalization.dart || {
            echo "::error::lib/utility/NtcColorLocalization.dart is imported by ChooseThemeColorPage.dart but is missing."
            exit 1
          }
          test -x android/gradlew || {
            echo "::error::android/gradlew must be committed and executable."
            exit 1
          }
          test -f android/gradle/wrapper/gradle-wrapper.jar || {
            echo "::error::The Gradle wrapper JAR must be committed."
            exit 1
          }

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run Flutter and release-preflight tests
        run: |
          flutter test --no-pub test third_party/adaptive_platform_ui/test
          python3 -m unittest discover -s test -p 'test_*.py'
          node --test test/*release*_test.mjs

      - name: Run Android background-notification tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Validate Android toolchain
        run: flutter analyze --suggestions

      - name: Validate release signing secrets
        if: github.event_name == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure release signing
        if: github.event_name == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=keystore.jks\n'
          } > android/key.properties

      - name: Build signed Android release
        if: github.event_name == 'release'
        shell: bash
        env:
          BUILD_NAME: ${{ needs.release_version.outputs.version }}
          BUILD_NUMBER: ${{ needs.release_version.outputs.build }}
        run: |
          version="$BUILD_NAME+$BUILD_NUMBER"
          # Release builds must regenerate plugin registration for release mode.
          # --no-pub can retain dev-only plugins such as integration_test from
          # the dependency/toolchain checks, while Gradle excludes them.
          mkdir -p release
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          test -s build/app/outputs/mapping/release/mapping.txt
          cp build/app/outputs/mapping/release/mapping.txt release/apk-mapping.txt
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          git diff --exit-code -- pubspec.lock
          cp build/app/outputs/flutter-apk/app-release.apk release/
          cp build/app/outputs/bundle/release/app-release.aab release/
          python3 scripts/check_android_media_permissions.py \
            build/app/intermediates/packaged_manifests/release/processReleaseManifestForPackage/AndroidManifest.xml
          # Extract from the submitted AAB so this mapping always matches it.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          with ZipFile('release/app-release.aab') as bundle:
              mapping = bundle.read('BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map')
          if not mapping.strip():
              raise SystemExit('AAB contains an empty R8 mapping; check release minification.')
          Path('release/mapping.txt').write_bytes(mapping)
          PY
          printf 'Version: %s\nCommit: %s\nCI run: %s\n\nSubmit app-release.aab to Google Play.\nIts R8 mapping is embedded; use mapping.txt if a manual upload is requested.\napk-mapping.txt corresponds to app-release.apk.\n' \
            "$version" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release/android-release-info.txt
          (cd release && sha256sum app-release.apk app-release.aab mapping.txt apk-mapping.txt > SHA256SUMS.txt)
          cat release/android-release-info.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Build Android debug artifact
        if: github.event_name != 'release'
        shell: bash
        run: |
          flutter build apk --debug --no-pub
          python3 scripts/check_android_media_permissions.py \
            build/app/intermediates/packaged_manifests/debug/processDebugManifestForPackage/AndroidManifest.xml
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-debug.apk release/

      - name: Upload Android release artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android debug artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: release/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS
    needs: release_version
    if: ${{ !cancelled() && (github.event_name != 'release' || needs.release_version.result == 'success') }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # This job deliberately validates compatibility with the runner's SDK.
      REQUIRE_IPHONE_DUO: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check iPhone Duo project and SDK
        run: |
          python3 -m unittest discover -s test -p 'test_iphone_duo_preflight.py'
          python3 scripts/check_iphone_duo.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify required repository files
        shell: bash
        run: |
          test -f pubspec.lock || {
            echo "::error::pubspec.lock must be committed for reproducible builds."
            exit 1
          }
          test -f third_party/adaptive_platform_ui/pubspec.yaml || {
            echo "::error::The local Liquid Glass package is missing."
            exit 1
          }
          test -f third_party/apple_post_translation/pubspec.yaml || {
            echo "::error::The Apple Translation bridge is missing."
            exit 1
          }
          test -f darwin/WebViewCookies.swift || {
            echo "::error::The shared Apple WebView cookie bridge is missing."
            exit 1
          }
          test -f android/app/src/main/kotlin/com/kidozh/discuz_flutter/WebViewCookiesChannel.kt || {
            echo "::error::The Android WebView cookie bridge is missing."
            exit 1
          }
          test -f lib/utility/NtcColorLocalization.dart || {
            echo "::error::lib/utility/NtcColorLocalization.dart is imported by ChooseThemeColorPage.dart but is missing."
            exit 1
          }

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned iOS app
        shell: bash
        run: |
          version=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)$ ]]; then
            echo "::error::Expected pubspec.yaml version in name+build format."
            exit 1
          fi
          build_name="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[2]}"
          flutter build ios --release --no-codesign --no-pub --build-name="$build_name" --build-number="$build_number"
          plist=build/ios/iphoneos/Runner.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = "$build_name"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")" = "$build_number"

      - name: Package iOS build
        shell: bash
        run: |
          mkdir -p release
          tar -C build/ios/iphoneos -czf release/Runner-ios.tar.gz Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: release/Runner-ios.tar.gz
          if-no-files-found: error
          retention-days: 14

  github_assets:
    name: Attach binaries to GitHub Release
    if: github.event_name == 'release'
    needs: [android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  google_play:
    name: Submit Google Play production release
    if: github.event_name == 'release'
    needs: [release_version, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: google-play-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
      PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: android-release
          path: dist
      - name: Verify signed artifact and Play authorization settings
        run: |
          (cd dist && sha256sum --check SHA256SUMS.txt)
          if [[ -z "$PLAY_WORKLOAD_IDENTITY_PROVIDER" || -z "$PLAY_SERVICE_ACCOUNT" ]]; then
            echo '::error::Configure PLAY_WORKLOAD_IDENTITY_PROVIDER and PLAY_SERVICE_ACCOUNT. See docs/store-release.md.'
            exit 1
          fi
      - name: Authenticate as the Play publishing service account
        id: play_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Submit signed AAB to the production track
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        run: |
          python3 scripts/prepare_store_release.py --tag "$GITHUB_REF_NAME" --output dist/store-release.json
          node scripts/submit_google_play.mjs dist/store-release.json dist/app-release.aab
