name: discuz_flutter
description: Lightweight flutter client for Discuz X

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.0.11+168

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"
#  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  json_annotation: ^4.12.0
  # chewie (via flutter_widget_from_html) still requires the 1.x icon font.
  cupertino_icons: ^1.0.9
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  retrofit: ^4.10.0
  logger: ^2.8.0  #for logging purpose
  settings_ui: ^4.0.2
  form_validator: ^2.1.1
  # persistent_bottom_nav_bar: ^5.0.2
  cached_network_image: ^4.0.6
  provider: ^6.1.5+1
  flutter_localizations:
    sdk: flutter
  flutter_spinkit: ^5.2.2
  flutter_easyloading: ^4.0.2
  json_serializable: ^6.15.2
  webview_flutter: ^4.14.1
  # Includes the upstream authentication-challenge NSNull fix.
  webview_flutter_wkwebview: ^3.27.2
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  photo_view: ^0.15.0
  permission_handler: ^13.0.2
  # open_file: ^3.2.1
  flutter_slidable: ^4.0.3

  intl: ^0.20.3
  adaptive_platform_ui:
    path: third_party/adaptive_platform_ui
  foldable: ^1.0.5
  platform_adaptive_widgets: ^2.2.0
  flutter_launcher_icons: ^0.14.4
  extended_text_field: ^17.0.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1

  package_info_plus: ^10.2.2
  flutter_native_splash: ^2.4.8
  slide_countdown: ^2.0.2

  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  device_info_plus: ^13.3.0
  share_plus: ^13.3.1
  firebase_messaging: ^17.0.1
  font_awesome_flutter: ^11.0.0
  firebase_analytics: ^13.0.1
  flutter_local_notifications: ^22.3.3
  # flutter_apns: ^1.6.0
  scroll_to_index: ^3.0.1
  # v4 requires material_ui/cupertino_ui themes; this app uses Flutter themes.
  easy_refresh: ^3.5.1
  open_filex: ^5.0.0
  flutter_polls: ^0.1.6
  push: ^3.3.3
  google_mobile_ads: ^9.2.0
  dynamic_color: ^2.1.0
  intl_utils: ^2.8.17
  carousel_slider: ^5.1.2
  upgrader: ^13.7.0
  # v10 migrates v9 Android data; users must run it before a future v11 upgrade.
  flutter_secure_storage: ^10.3.4
  local_auth: ^3.0.2
  # New major UI releases use different ThemeData/TextTheme types.
  flex_color_picker: ^3.8.0
  google_fonts: ^8.2.1
  chinese_font_library: ^1.3.0
  # toastification: ^2.0.0
  haptic_feedback: ^0.8.0


  # firebase_core: ^3.2.0
  html: ^0.15.7
  ios_utsname_ext: ^2.3.0
  ua_client_hints: ^1.7.0
  random_user_agents: ^1.0.29
  flutter_widget_from_html: ^0.17.4
  html_unescape: ^2.0.0
  language_code: ^0.7.1
  web: ^1.1.2
  persistent_bottom_nav_bar: ^6.2.1
  fwfh_cached_network_image: ^0.16.3
  flutter_cache_manager: ^3.4.6
  flutter_cache_manager_dio: ^4.0.0
  saver_gallery: ^5.1.0
  flex_color_scheme: ^8.4.0


  firebase_core: ^5.1.0
  foundation_models_framework: ^0.2.1
  apple_post_translation:
    path: third_party/apple_post_translation
  crypto: ^3.0.8
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # hive_ce_generator requires build 4; build_runner 2.17 requires build 5.
  build_runner: ^2.16.2
  retrofit_generator: ^10.3.2
  hive_ce_generator: ^1.12.0
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/translation/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_intl:
  enabled: true

flutter_launcher_icons:
  # android: "launcher_icon"
  android: false
  ios: true
  image_path_ios: "assets/icon/icon-light-ios-900px.png"
  image_path_ios_dark_transparent: "assets/icon/icon-dark-ios-900px.png"
  image_path_ios_tinted_grayscale: "assets/icon/icon-grayscale-ios-900px.png"
  #desaturate_tinted_to_grayscale_ios: true
  remove_alpha_ios: true
