plugins {
    id "com.android.application"
    // Keep the external Kotlin plugin while legacy Flutter plugins still apply it themselves.
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle plugin must be applied after Android and Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.kidozh.discuz_flutter"
    // Flutter owns these defaults. Upgrading Flutter now updates them in one place.
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.kidozh.discuz_flutter"
        // This is a product requirement rather than a toolchain default.
        minSdk = 30
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
            storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword = keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
            debuggable = true
            pseudoLocalesEnabled = true
            applicationIdSuffix = ".debug"
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            shrinkResources = false
        }
    }

    lint {
        disable += "InvalidPackage"
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    // AndroidOnDeviceAiChannel uses the Prompt API and its ListenableFuture bridge.
    // Pin the native SDK so clean CI builds resolve the same API surface.
    implementation "com.google.mlkit:genai-prompt:1.0.0-beta4"
    implementation "androidx.window:window:1.2.0"
    implementation "androidx.window:window-java:1.2.0"
}
